<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<title>BATIMAT 2026</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px}
main{padding:14px;max-width:760px;margin:auto}
.card{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0002}
label{display:block;font-weight:700;margin-top:10px}
input,textarea,select{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
textarea{min-height:120px}
button{border:0;border-radius:9px;padding:11px 14px;margin:7px 4px 0 0;font-size:16px;font-weight:700}
.primary{background:#111827;color:white}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}
.visit{border-left:5px solid #111827}
.small{font-size:13px;color:#64748b}
audio{width:100%;margin-top:8px}
img.preview{width:100%;max-height:300px;object-fit:cover;border-radius:8px;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>BATIMAT 2026</h1><div>Registo de visitas</div></header>
<main>
<div class="card">
<h2>Nova visita</h2>
<label>Código</label><input id="code" placeholder="Ex.: A01">
<label>Stand</label><input id="stand" placeholder="Ex.: H1-R010">
<label>Empresa</label><input id="company">
<label>Hall / área</label><input id="hall">
<label>Categoria</label>
<select id="category">
<option value="Offsite">Offsite</option>
<option value="Pré-fabricação">Pré-fabricação</option>
<option value="DFMA">DFMA</option>
<option value="Estruturas">Estruturas</option>
<option value="Fachadas">Fachadas</option>
<option value="Módulos">Módulos</option>
<option value="Casas de banho">Casas de banho</option>
<option value="MEP racks">MEP racks</option>
<option value="Shafts">Shafts</option>
<option value="Ligações">Ligações</option>
<option value="Robótica/automação">Robótica/automação</option>
<option value="BIM/DFMA">BIM/DFMA</option>
<option value="Outros sistemas industrializados">Outros sistemas industrializados</option>
<option value="Outra">Outra</option>
</select>
<div id="otherCategoryBox" class="hidden">
<label>Outra categoria</label><input id="otherCategory" placeholder="Escreva a categoria">
</div>
<label>Contacto / pessoa</label><input id="contact">
<label>Notas</label>
<textarea id="notes" placeholder="O que fazem / produto ou sistema:
• Como funciona e o que é industrializado
• Produção / engenharia / montagem
• Projetos ou referências
• BIM / DFMA / integração com projeto
• O que achei interessante para a Gabriel Couto
• Perguntas, contactos e informações relevantes

Pode escrever ou usar o microfone do teclado Samsung para ditar."></textarea>
<label>Relevância</label>
<select id="relevance"><option>Alta</option><option>Média</option><option>Baixa</option></select>
<label>Potencial de parceria</label>
<select id="partnership"><option>Alto</option><option>Médio</option><option>Baixo</option></select>
<label>Próximo passo</label><input id="nextStep">

<div>
<button class="secondary" id="photoBtn">📷 Adicionar foto</button>
<input class="hidden" id="photoInput" type="file" accept="image/*" capture="environment">
</div>

<div>
<button class="secondary" id="recordBtn">🎙️ Gravar áudio</button>
<button class="danger hidden" id="stopBtn">⏹️ Parar gravação</button>
</div>
<div id="audioStatus" class="small"></div>
<div id="audioBox"></div>

<button class="primary" id="saveBtn">💾 Guardar visita</button>
<button class="secondary" id="clearBtn">Limpar</button>
</div>

<div class="card">
<h2>Visitas guardadas</h2>
<div id="count" class="small">0 visitas</div>
<div id="visits"></div>
<button class="secondary" id="exportBtn">⬇️ Exportar JSON</button>
</div>
</main>

<script>
const DB='batimat26db', STORE='visits';
let db, photos=[], audioData=null, recorder=null, chunks=[], stream=null;

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE)) e.target.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});};
  r.onsuccess=e=>{db=e.target.result;resolve(db)};
  r.onerror=e=>reject(e);
 });
}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function allVisits(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function addVisit(v){return new Promise((res,rej)=>{let r=tx('readwrite').add(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

document.getElementById('category').onchange=()=>{
 const show=document.getElementById('category').value==='Outra';
 document.getElementById('otherCategoryBox').classList.toggle('hidden',!show);
 if(!show) document.getElementById('otherCategory').value='';
};

function val(id){return document.getElementById(id).value}
function clearForm(){
 ['code','stand','company','hall','contact','notes','nextStep','otherCategory'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('relevance').value='Alta';document.getElementById('partnership').value='Alto';
 document.getElementById('category').value='Offsite';document.getElementById('otherCategoryBox').classList.add('hidden');photos=[];audioData=null;document.getElementById('audioBox').innerHTML='';document.getElementById('audioStatus').textContent='';
}

document.getElementById('photoBtn').onclick=()=>document.getElementById('photoInput').click();
document.getElementById('photoInput').onchange=async e=>{
 const f=e.target.files[0]; if(!f)return;
 const reader=new FileReader();reader.onload=()=>{photos.push(reader.result);renderPhotoPreview();};reader.readAsDataURL(f);
};
function renderPhotoPreview(){
 document.getElementById('audioBox').insertAdjacentHTML('beforebegin',
  photos.length?'<div class="small">Fotos adicionadas: '+photos.length+'</div>':'');
}

document.getElementById('recordBtn').onclick=async()=>{
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('O navegador não disponibiliza gravação de áudio.');
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
  recorder=new MediaRecorder(stream,{mimeType:mime});chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
   const reader=new FileReader();
   reader.onload=()=>{audioData=reader.result;document.getElementById('audioBox').innerHTML='<audio controls src="'+audioData+'"></audio>';document.getElementById('audioStatus').textContent='Áudio gravado. Agora prima “Guardar visita”.';};
   reader.readAsDataURL(blob);
   if(stream)stream.getTracks().forEach(t=>t.stop());
  };
  recorder.start();
  document.getElementById('recordBtn').classList.add('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');
  document.getElementById('audioStatus').textContent='A gravar…';
 }catch(e){
  document.getElementById('audioStatus').textContent='Não foi possível gravar: '+e.message;
 }
};
document.getElementById('stopBtn').onclick=()=>{
 if(recorder && recorder.state!=='inactive') recorder.stop();
 document.getElementById('stopBtn').classList.add('hidden');
 document.getElementById('recordBtn').classList.remove('hidden');
};

document.getElementById('saveBtn').onclick=async()=>{
 try{
  const visit={createdAt:new Date().toISOString(),code:val('code'),stand:val('stand'),company:val('company'),hall:val('hall'),category:(val('category')==='Outra'?val('otherCategory'):val('category')),contact:val('contact'),notes:val('notes'),relevance:val('relevance'),partnership:val('partnership'),nextStep:val('nextStep'),photos:[...photos],audioData:audioData};
  await addVisit(visit);
  alert('Visita guardada.');
  clearForm(); renderVisits();
 }catch(e){alert('Erro ao guardar a visita: '+e.message)}
};

async function renderVisits(){
 const vs=await allVisits();document.getElementById('count').textContent=vs.length+' visita(s)';
 const box=document.getElementById('visits');box.innerHTML='';
 vs.slice().reverse().forEach(v=>{
  const d=document.createElement('div');d.className='card visit';
  d.innerHTML='<b>'+(v.code||'Sem código')+' — '+(v.company||'Sem empresa')+'</b><div class="small">'+(v.stand||'')+' · '+new Date(v.createdAt).toLocaleString()+'</div><p>'+escapeHtml(v.notes||'')+'</p>';
  if(v.audioData){const a=document.createElement('audio');a.controls=true;a.src=v.audioData;d.appendChild(a)}
  (v.photos||[]).forEach(p=>{const im=document.createElement('img');im.className='preview';im.src=p;d.appendChild(im)});
  box.appendChild(d);
 });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

document.getElementById('clearBtn').onclick=clearForm;
document.getElementById('exportBtn').onclick=async()=>{
 const vs=await allVisits();
 const blob=new Blob([JSON.stringify({app:'BATIMAT 2026',version:5,exportedAt:new Date().toISOString(),visits:vs},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BATIMAT_2026_visitas.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
openDB().then(renderVisits);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
